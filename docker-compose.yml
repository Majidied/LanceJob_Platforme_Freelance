version: '3.8'

services:

  # Elasticsearch for search functionality
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: lancejob-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=lancejob-cluster
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - lancejob-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5


volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  recommendation_logs:
    driver: local
  recommendation_models:
    driver: local
  backend_logs:
    driver: local

networks:
  lancejob-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
